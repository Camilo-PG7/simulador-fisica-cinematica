<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#05070f"/>
  <!-- Grid lines -->
  <line x1="8" y1="48" x2="56" y2="48" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <line x1="8" y1="8" x2="8" y2="48" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <!-- Parabolic trajectory -->
  <path d="M 10 46 Q 32 6 54 46" 
        fill="none" 
        stroke="#00e5ff" 
        stroke-width="2.5" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  <!-- Projectile dot at peak -->
  <circle cx="32" cy="10" r="4" fill="#00e5ff" filter="url(#glow)"/>
  <!-- Impact dot -->
  <circle cx="54" cy="46" r="2.5" fill="rgba(0,229,255,0.6)"/>
  <!-- Glow filter -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
